<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strobos Software</title>
  <meta name="description" content="Strobos Software — software and data engineering consulting. Coming soon.">
  <meta property="og:title" content="Strobos Software">
  <meta property="og:description" content="Software and data engineering consulting. Coming soon.">
  <meta property="og:url" content="https://strobos.dev">
  <meta name="theme-color" content="#0b0d10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f2f2ee'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f4f4f0;
      --fg: #0b0d10;
      --muted: #5c6066;
      --line: #d6d6cf;
      --accent: #0b0d10;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d10;
        --fg: #f2f2ee;
        --muted: #8b9098;
        --line: #23262b;
        --accent: #f2f2ee;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 100vh;
      padding: 0 24px;
    }
    main {
      align-self: center;
      justify-self: center;
      width: 100%;
      max-width: 640px;
      padding: 64px 0;
    }
    .mark {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      margin-bottom: 40px;
      animation: strobe 2.4s infinite;
    }
    @keyframes strobe {
      0%, 6%, 12% { opacity: 1; }
      3%, 9% { opacity: 0.15; }
      13%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark { animation: none; }
    }
    h1 {
      font-size: clamp(2.25rem, 7vw, 3.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .tagline {
      margin-top: 16px;
      font-size: clamp(1.05rem, 2.6vw, 1.25rem);
      color: var(--muted);
      line-height: 1.5;
      max-width: 34ch;
    }
    .status {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 24px;
      font-size: 0.95rem;
      color: var(--muted);
    }
    a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      transition: border-color 0.15s;
    }
    a:hover, a:focus-visible { border-color: var(--fg); outline: none; }
    footer {
      justify-self: center;
      width: 100%;
      max-width: 640px;
      padding: 24px 0 32px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Strobos Software</h1>
    <p class="tagline">Software and data engineering consulting.</p>
    <div class="status">
      <span>Site coming soon.</span>
      <a href="mailto:luiz@strobos.dev">luiz@strobos.dev</a>
    </div>
  </main>
  <footer>&copy; <span id="y">2026</span> Strobos Software</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
